{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — Календарь</title><link rel="stylesheet" href="{% static 'events/calendar.css' %}"><style>body{min-height:100vh;display:grid;place-items:center;background:#f5f7fb}.login-card{width:min(400px,90vw);padding:36px;background:white;border-radius:20px;box-shadow:0 12px 40px #14213d18}.login-card h1{margin:12px 0 24px}.login-card label{display:block;margin:16px 0}.login-card input{display:block;width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:8px}.login-card button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#5368d8;color:white;cursor:pointer}.errorlist{color:#b3261e}</style></head><body><main class="login-card"><div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><span>Календарь</span></div><h1>Вход в календарь</h1>{% if form.errors %}<p role="alert">Проверьте имя пользователя и пароль.</p>{% endif %}<form method="post">{% csrf_token %}<label>Имя пользователя {{ form.username }}</label><label>Пароль {{ form.password }}</label><button type="submit">Войти</button></form></main></body></html>

  <text x="128" y="671" fill="#657286" font-family="Manrope, Inter, Arial, sans-serif" font-size="19">После даты обрезания</text>

  <text x="32" y="719" fill="#596679" font-family="Manrope, Inter, Arial, sans-serif" font-size="19">2 и 9 ноября возвращаются с одним ID серии</text>

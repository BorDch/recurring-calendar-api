services:
  web:
    build: .
    environment:
      CALENDAR_PROFILE: local
      CALENDAR_DB: /data/db.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - calendar_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
  postgres:
    profiles: [postgres]
    image: postgres:17
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - calendar_pg_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar"]
      interval: 2s
      retries: 15
volumes:
  calendar_data:
  calendar_pg_test:

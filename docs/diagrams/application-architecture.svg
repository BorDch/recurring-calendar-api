  <text x="417" y="207" fill="#2359ae" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">API-клиент</text>
  <text x="358" y="242" fill="#536b90" font-family="Manrope, Inter, Arial, sans-serif" font-size="18">HTTP-запросы</text>

  <path d="M166 261 V283 H280 V309" fill="none" stroke="#7da6e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M474 261 V283 H360 V309" fill="none" stroke="#7da6e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="170" y="316" width="300" height="112" rx="16" fill="#2869de"/>
  <text x="320" y="365" text-anchor="middle" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="30" font-weight="800">Django</text>

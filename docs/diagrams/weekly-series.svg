<svg xmlns="http://www.w3.org/2000/svg" width="640" height="748" viewBox="0 0 640 748" role="img" aria-labelledby="title desc">
  <title id="title">Еженедельная серия: ноябрь 2026</title>
  <desc id="desc">Повторы одной серии с общим ID: 2 ноября исходное название, 9 ноября новое, 16 ноября отмена только этой даты, 23 и 30 ноября отсутствуют после обрезания с 23 ноября включительно.</desc>
  <rect width="640" height="748" fill="#f7f9fc"/>
  <rect x="8" y="8" width="624" height="732" rx="18" fill="#ffffff" stroke="#e8edf3" stroke-width="2"/>
  <rect x="32" y="32" width="7" height="35" rx="3.5" fill="#2869de"/>
  <text x="54" y="49" fill="#3d74cb" font-family="Manrope, Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">НОЯБРЬ 2026 · UTC</text>
  <text x="32" y="94" fill="#252d3b" font-family="Manrope, Inter, Arial, sans-serif" font-size="29" font-weight="800">Еженедельная серия</text>
  <text x="32" y="126" fill="#596679" font-family="Manrope, Inter, Arial, sans-serif" font-size="19">Начало 2 ноября, 09:00 · период 7 дней</text>
  <rect x="32" y="145" width="250" height="38" rx="19" fill="#eaf2ff"/>
  <text x="54" y="171" fill="#2359ae" font-family="Manrope, Inter, Arial, sans-serif" font-size="19" font-weight="800">Один ID для всей серии</text>

  <path d="M66 231 V334 V438" fill="none" stroke="#9bbef3" stroke-width="5" stroke-linecap="round"/>
  <path d="M66 438 V646" fill="none" stroke="#cbd5e3" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 11"/>

  <circle cx="66" cy="231" r="29" fill="#2869de"/>
  <text x="66" y="239" text-anchor="middle" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">02</text>
  <rect x="110" y="194" width="494" height="80" rx="12" fill="#edf4ff" stroke="#c7d9fa" stroke-width="2"/>
  <text x="128" y="226" fill="#2359ae" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">Еженедельный осмотр</text>
  <text x="128" y="254" fill="#2359ae" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">линии №2</text>

  <circle cx="66" cy="334" r="29" fill="#2869de"/>
  <text x="66" y="342" text-anchor="middle" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">09</text>
  <rect x="110" y="297" width="494" height="80" rx="12" fill="#edf4ff" stroke="#c7d9fa" stroke-width="2"/>
  <text x="128" y="329" fill="#2359ae" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">Повторный осмотр</text>
  <text x="128" y="357" fill="#2359ae" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">линии №2 · только эта дата</text>

  <circle cx="66" cy="438" r="29" fill="#c64452"/>
  <text x="66" y="446" text-anchor="middle" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">16</text>
  <rect x="110" y="401" width="494" height="80" rx="12" fill="#fff4f5" stroke="#f0cbd0" stroke-width="2"/>
  <text x="128" y="435" fill="#aa3542" font-family="Manrope, Inter, Arial, sans-serif" font-size="23" font-weight="800">Отменено</text>
  <text x="128" y="463" fill="#7e5b62" font-family="Manrope, Inter, Arial, sans-serif" font-size="19">Только повторение 16 ноября</text>

  <circle cx="66" cy="542" r="29" fill="#d3dce8"/>
  <text x="66" y="550" text-anchor="middle" fill="#4f5e73" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="800">23</text>
  <rect x="110" y="505" width="494" height="80" rx="12" fill="#f5f7fa" stroke="#e2e7ee" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="658" viewBox="0 0 640 658" role="img" aria-labelledby="title desc">
  <title id="title">Схема приложения recurring-calendar-api</title>
  <desc id="desc">Браузер и API-клиент обращаются к Django. В зависимости от CALENDAR_PROFILE Django использует SQLite в local и private либо PostgreSQL в production.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#7da6e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="658" fill="#f7f9fc"/>
  <rect x="8" y="8" width="624" height="642" rx="18" fill="#ffffff" stroke="#e8edf3" stroke-width="2"/>
  <rect x="32" y="32" width="7" height="35" rx="3.5" fill="#2869de"/>
  <text x="54" y="49" fill="#3d74cb" font-family="Manrope, Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">RECURRING-CALENDAR-API</text>
  <text x="32" y="94" fill="#252d3b" font-family="Manrope, Inter, Arial, sans-serif" font-size="29" font-weight="800">Схема приложения</text>
  <text x="32" y="124" fill="#596679" font-family="Manrope, Inter, Arial, sans-serif" font-size="19">Один Django-сервис, два способа обращения</text>

  <rect x="32" y="167" width="268" height="94" rx="14" fill="#edf4ff" stroke="#c7d9fa" stroke-width="2"/>
  <rect x="50" y="186" width="42" height="34" rx="5" fill="#2869de"/>
  <rect x="55" y="191" width="32" height="24" rx="2" fill="#ffffff"/>
  <path d="M55 198 H87" stroke="#2869de" stroke-width="2"/>
  <text x="109" y="207" fill="#2359ae" font-family="Manrope, Inter, Arial, sans-serif" font-size="23" font-weight="800">Браузер</text>
  <text x="50" y="242" fill="#536b90" font-family="Manrope, Inter, Arial, sans-serif" font-size="18">Календарь и формы</text>

  <rect x="340" y="167" width="268" height="94" rx="14" fill="#edf4ff" stroke="#c7d9fa" stroke-width="2"/>
  <rect x="358" y="186" width="42" height="34" rx="6" fill="#2869de"/>
